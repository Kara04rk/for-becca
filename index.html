<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Becca:) 💖</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="particle-container"></div>

    <div class="card" id="confession-card">
        <div id="question-view">
            <div class="heart-icon">💝</div>
            <h1>Hey Becca!! do you like me?</h1>
            <p class="subtext">👉👈 please choose one...</p>
            <div class="button-container">
                <button class="btn yes-btn" id="yes-btn">Yes I like you! 💖</button>
                <button class="btn no-btn" id="no-btn">No 😢</button>
            </div>
        </div>

        <div id="success-view" class="hidden">
            <div class="success-icon">🎉🌸</div>
            <h1>Yayyy, I like you too:)</h1>
            <p class="success-text">Here is a bouquet of virtual flowers just for you! 💐</p>
            
            <div class="flower-box">
                <span class="flower">🌸</span>
                <span class="flower">🌹</span>
                <span class="flower">🌷</span>
                <span class="flower">🌻</span>
                <span class="flower">🌺</span>
                <span class="flower">🌼</span>
            </div>
            
            <div class="ribbon">🎀</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
